<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ key }} &mdash; {{ panel }}</title>
<style>
{{ chrome|safe }}
 h1{font-size:22px;margin:10px 0 2px}
 p.sub{font-size:12px;font-family:ui-monospace,monospace;word-break:break-all}
 .drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;
      text-align:center;color:var(--muted)}
 .drop.over{border-color:var(--accent);color:var(--text)}
 .drop .big{font-size:30px;display:block;margin-bottom:6px}
 /* The label IS the button; the input behind it is hidden. */
 label.browse{display:block;margin-top:14px;min-height:50px;line-height:50px;
      border-radius:11px;border:none;text-align:center;font-size:15px;
      font-weight:600;cursor:pointer;color:#0d1a12;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 6px 22px var(--glow)}
 button{width:100%;margin-top:12px}
 button:disabled{opacity:.45}
 ul{list-style:none;padding:0;margin:14px 0 0}
 li{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
 li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 li .sz{color:var(--muted);font-size:12px;white-space:nowrap}
 li .x{color:var(--bad);padding:0 8px;font-size:20px;line-height:1}
 .ok{color:var(--accent)} .bad{color:var(--bad)}
</style></head><body>
<div class="backrow">{{ back_button(token)|safe }}{{ back_button(token, "All folders", "/upload")|safe }}</div>
<h1>Upload to {{ key }}</h1>
<p class="sub">{{ path }}</p>

<section>
  <div class="drop" id="drop">
    <span class="big">&#8679;</span>
    Drop files here
  </div>
  <label class="browse" for="pick">Choose files</label>
  <input type="file" id="pick" multiple hidden>

  <ul id="list"><li class="empty">Nothing queued yet.</li></ul>
  <button id="send" disabled>Upload</button>
</section>

<section id="resultBox" style="display:none">
  <ul id="results"></ul>
</section>

<script>
 var KEY = {{ key|tojson }};
 var TOKEN = {{ token|tojson }};
 var queue = [];

 var drop = document.getElementById('drop');
 var list = document.getElementById('list');
 var send = document.getElementById('send');
 var results = document.getElementById('results');
 var resultBox = document.getElementById('resultBox');

 function human(n) {
   if (n < 1024) return n + ' B';
   if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
   return (n / 1048576).toFixed(1) + ' MB';
 }

 function draw() {
   list.innerHTML = '';
   if (!queue.length) {
     list.innerHTML = '<li class="empty">Nothing queued yet.</li>';
     send.disabled = true;
     send.textContent = 'Upload';
     return;
   }
   queue.forEach(function (f, i) {
     var li = document.createElement('li');
     var nm = document.createElement('span');
     nm.className = 'nm'; nm.textContent = f.name;
     var sz = document.createElement('span');
     sz.className = 'sz'; sz.textContent = human(f.size);
     var x = document.createElement('span');
     x.className = 'x'; x.textContent = '\u00d7';
     x.addEventListener('click', function () { queue.splice(i, 1); draw(); });
     li.appendChild(nm); li.appendChild(sz); li.appendChild(x);
     list.appendChild(li);
   });
   send.disabled = false;
   send.textContent = 'Upload ' + queue.length +
                      ' file' + (queue.length === 1 ? '' : 's');
 }

 function add(files) {
   for (var i = 0; i < files.length; i++) { queue.push(files[i]); }
   draw();
 }

 document.getElementById('pick').addEventListener('change', function () {
   add(this.files); this.value = '';
 });

 ['dragenter', 'dragover'].forEach(function (e) {
   drop.addEventListener(e, function (ev) {
     ev.preventDefault(); drop.classList.add('over');
   });
 });
 ['dragleave', 'drop'].forEach(function (e) {
   drop.addEventListener(e, function (ev) {
     ev.preventDefault(); drop.classList.remove('over');
   });
 });
 drop.addEventListener('drop', function (ev) {
   if (ev.dataTransfer && ev.dataTransfer.files) { add(ev.dataTransfer.files); }
 });

 function report(name, ok, detail) {
   resultBox.style.display = 'block';
   var li = document.createElement('li');
   var nm = document.createElement('span');
   nm.className = 'nm'; nm.textContent = name;
   var st = document.createElement('span');
   st.className = ok ? 'ok' : 'bad';
   st.textContent = ok ? 'uploaded' : (detail || 'failed');
   li.appendChild(nm); li.appendChild(st);
   results.appendChild(li);
 }

 send.addEventListener('click', function () {
   if (!queue.length) { return; }
   send.disabled = true;
   var pending = queue.slice();
   queue = [];
   draw();
   var left = pending.length;
   pending.forEach(function (file) {
     var body = new FormData();
     body.append('file', file);
     fetch('/upload/' + encodeURIComponent(KEY) +
           '?token=' + encodeURIComponent(TOKEN),
           { method: 'POST', body: body })
       .then(function (r) { return r.json().catch(function () { return {}; }); })
       .then(function (b) {
         report(file.name, b.request === 'Success', b.reason);
       })
       .catch(function (e) { report(file.name, false, String(e)); })
       .finally(function () { if (--left === 0) { send.disabled = false; } });
   });
 });
</script>
</body></html>
