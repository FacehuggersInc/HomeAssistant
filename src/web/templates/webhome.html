<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ panel }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Left alone by Chromium's force-dark.
     The engine runs with forceDarkModeEnabled so ordinary sites come out dark;
     a page that declares itself dark is skipped, which is what stops this one
     being inverted into a white rectangle. -->
<meta name="color-scheme" content="dark">
<style>
{{ chrome|safe }}
 :root{color-scheme:dark}
 /* This page sets its own column width through .inner, so the shared cap
    would hold it below the width the bookmark grid is measured for. */
 body{max-width:none;display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:100vh;padding:48px 32px;
      box-sizing:border-box}
 .inner{width:100%;max-width:860px}

 /* The clock is the anchor, not a decoration. Aligned left with everything
    else rather than centred, so the eye has one column to travel down. */
 .head{display:flex;align-items:baseline;justify-content:center;gap:16px;
        margin:0 0 30px}
 .clock{font-size:56px;font-weight:250;letter-spacing:-1.5px;line-height:1;
        margin:0}
 .date{color:var(--muted);font-size:15px;margin:0}

 .search{position:relative;margin:0 auto 40px;max-width:640px}
 .search input{width:100%;box-sizing:border-box;min-height:56px;
   padding:0 20px 0 52px;font-size:17px;border-radius:12px;
   border:1px solid var(--line);background:var(--card);color:var(--text);
   font-family:inherit}
 .search input::placeholder{color:var(--muted)}
 .search input:focus{outline:none;border-color:var(--accent)}
 .search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);
   width:20px;height:20px;color:var(--muted);pointer-events:none}

 h2{font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin:0 0 14px;
    text-align:center}

 /* Wider than they were: a bookmark's title is the whole of knowing what it
    is, and 150px cut most of them off. */
 /* auto-fit: a lone bookmark on the last row shares the width rather than
    sitting at a quarter of it against the left edge. */
 .grid{display:grid;gap:10px;
       grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
 .mark{position:relative;display:flex;align-items:center;gap:12px;
       padding:14px 40px 14px 14px;
       border:1px solid var(--line);border-radius:12px;background:var(--card);
       text-decoration:none;color:var(--text);min-height:64px}
 .mark:hover{border-color:var(--accent);text-decoration:none}
 .mark:active{opacity:.7}
 .mark img{width:28px;height:28px;border-radius:7px;object-fit:contain;
           flex:none}
 .mark .letter{width:28px;height:28px;border-radius:7px;background:#26262b;
   display:flex;align-items:center;justify-content:center;font-size:14px;
   font-weight:700;color:var(--accent);flex:none}
 .mark .name{font-size:14px;font-weight:500;line-height:1.3;min-width:0;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

 /* A glyph, not a labelled control. The shared button rule carries the height
    and padding a button with words in it needs, and the card reserves 40px on
    its right for this - so it states its own size and sits in that space. */
 .drop{position:absolute;right:8px;top:50%;transform:translateY(-50%);
   width:28px;height:28px;min-height:0;padding:0;border:none;background:none;
   color:var(--muted);font-size:18px;line-height:1;border-radius:8px;
   opacity:.55}
 .drop:hover{opacity:1;background:rgba(255,122,122,.16);color:#ffb3b3;
   border:none}

 /* Centred under a centred heading. A max-width with no auto margin holds
    the box at the left of the column while the h2 above it sits in the
    middle, which reads as one of the two being wrong. */
 .empty{color:var(--muted);font-size:14px;line-height:1.7;
        border:1px dashed var(--line);border-radius:12px;padding:22px;
        max-width:520px;margin:0 auto;text-align:center}
 .empty code{background:var(--card);padding:2px 7px;border-radius:6px;
             color:var(--text)}
</style>
</head>
<body>
<div class="inner">

<div class="head">
  <p class="clock" id="clock">&nbsp;</p>
  <p class="date" id="date">&nbsp;</p>
</div>

<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
    <path d="M20 20l-3.5-3.5"/></svg>
  <input type="search" id="q" placeholder="Search, or type an address"
         autocomplete="off" spellcheck="false" aria-label="Search">
</div>

{% if bookmarks %}
<h2>{{ bookmarks|length }} saved</h2>
<div class="grid">
  {% for mark in bookmarks %}
  <div class="mark">
    <a href="{{ mark.url }}" title="{{ mark.url }}"
       style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;
              color:inherit;text-decoration:none">
      {% if mark.icon %}
        <img src="/bookmark-icon/{{ mark.icon }}" alt="">
      {% else %}
        <span class="letter">{{ mark.initial }}</span>
      {% endif %}
      <span class="name">{{ mark.label }}</span>
    </a>
    <button class="drop" data-url="{{ mark.url }}"
            title="Forget this bookmark">&times;</button>
  </div>
  {% endfor %}
</div>
{% else %}
<h2>Nothing saved</h2>
<p class="empty">Open a page and press the <code>&#9734;</code> in the toolbar
  to keep it here.</p>
{% endif %}

</div>
<script>
// Forgetting one, from the page it is on.
Array.prototype.forEach.call(document.querySelectorAll('.drop'),
  function (button) {
    button.addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/bookmark/forget?url=' +
            encodeURIComponent(button.getAttribute('data-url')))
        .then(function () { window.location.reload(); })
        .catch(function () { window.location.reload(); });
    });
  });

// Drawn here rather than rendered in: this is served once and then sits on
// screen, so a clock baked in at request time is wrong a minute later.
function tick() {
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent =
    (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  document.getElementById('date').textContent =
    now.toLocaleDateString(undefined,
      {weekday: 'long', day: 'numeric', month: 'long'});
}
tick();
setInterval(tick, 10000);

// An address goes to the address; everything else is a search.
//
// Typing 192.168.1.4 and being handed a page of search results about it is
// the single most annoying thing a search box on a home network can do -
// which is most of what this box is for.
var IPV4 = /^(\d{1,3}\.){3}\d{1,3}(:\d{1,5})?(\/.*)?$/;
var HOSTPORT = /^[a-z0-9.-]+:\d{1,5}(\/.*)?$/i;
// The last label must contain a letter, or "3.14" is an address.
var DOTTED = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z0-9-]*[a-z][a-z0-9-]*(:\d{1,5})?(\/.*)?$/i;

function looksLikeAddress(text) {
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) { return text; }
  if (text.indexOf(' ') !== -1) { return null; }
  if (text === 'localhost' || /^localhost[:\/]/.test(text)) {
    return 'http://' + text;
  }
  if (IPV4.test(text)) {
    // Each part has to be a real octet, or 999.1.2.3 becomes a broken
    // navigation instead of the search it obviously is.
    var host = text.split('/')[0].split(':')[0];
    var parts = host.split('.');
    for (var i = 0; i < parts.length; i++) {
      if (parseInt(parts[i], 10) > 255) { return null; }
    }
    return 'http://' + text;
  }
  if (HOSTPORT.test(text) || DOTTED.test(text)) { return 'http://' + text; }
  return null;
}

document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') { return; }
  var text = this.value.trim();
  if (!text) { return; }
  var address = looksLikeAddress(text);
  window.location.href = address ? address
    : 'https://duckduckgo.com/?q=' + encodeURIComponent(text);
});
</script>
</body>
</html>
