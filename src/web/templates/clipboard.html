<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
{{ chrome|safe }}
 .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:16px;margin:0 0 16px}
 textarea{width:100%;min-height:150px;resize:vertical;
          background:#111114;color:var(--text);border:1px solid var(--line);
          border-radius:8px;padding:12px;font-size:16px;font-family:inherit;
          line-height:1.5}
 .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
      margin:12px 0 0}
 .row button{flex:1 1 130px}
 .empty{color:var(--muted);font-style:italic}
 #note{display:none}
</style>
</head>
<body>
{{ back_button(token)|safe }}

<h1>Clipboard</h1>
<p class="sub">Shared with {{ panel }}. Copying here puts it on this device;
  sending puts it on the panel.</p>

<p id="note" class="banner"></p>

<div class="card">
  <p class="label">On the panel now</p>
  <textarea id="text" spellcheck="false"
            placeholder="Nothing on the clipboard."></textarea>
  <div class="row">
    <button type="button" class="btn primary" id="copy">Copy to this device</button>
    <button type="button" id="send">Send to panel</button>
    <button type="button" id="refresh">Refresh</button>
  </div>
</div>

<script>
var TOKEN = {{ token|tojson }};
var box = document.getElementById('text');
var note = document.getElementById('note');

function say(message, bad) {
  note.textContent = message;
  note.className = bad ? 'banner bad' : 'banner';
  note.style.display = 'block';
}

function load() {
  fetch('/clipboard?token=' + encodeURIComponent(TOKEN))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.request !== 'Success') { say(d.reason || 'Could not read it.', true); return; }
      box.value = d.text || '';
      say(d.length ? d.length + ' characters on the panel.'
                   : 'The panel clipboard is empty.');
    })
    .catch(function (e) { say('Could not reach the panel: ' + e, true); });
}

document.getElementById('refresh').addEventListener('click', load);

document.getElementById('copy').addEventListener('click', function () {
  // The async Clipboard API needs a secure context, which a panel served over
  // plain http on a LAN is not. execCommand is deprecated and works there, so
  // it is the fallback rather than the other way round.
  var text = box.value;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(function () { say('Copied to this device.'); })
      .catch(function () { legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
});

function legacyCopy(text) {
  box.focus();
  box.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  say(ok ? 'Copied to this device.'
         : 'Could not copy automatically - the text is selected, so copy it '
           + 'by hand.', !ok);
}

document.getElementById('send').addEventListener('click', function () {
  fetch('/clipboard?token=' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: box.value})
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      say(d.request === 'Success'
            ? 'Sent to the panel.'
            : (d.reason || 'Could not send it.'),
          d.request !== 'Success');
    })
    .catch(function (e) { say('Could not reach the panel: ' + e, true); });
});

load();
</script>
</body>
</html>
