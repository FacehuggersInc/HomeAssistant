<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel }}</title>
<style>
{{ chrome|safe }}
 body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;max-width:none}
 .card{padding:30px;max-width:440px;width:100%;border-radius:16px}
 h1{font-size:22px;margin:0 0 6px}
 p{color:var(--muted);margin:0 0 20px;font-size:14px}
 .go{margin-top:16px}
 .go button{width:100%}
</style></head>
<body>
<div class="card">
  <h1>What should we call you?</h1>
  <p>The panel ({{ panel }}) knows this device as "{{ suggested }}". A person's name is more
     use — it is what your events will be filed under.</p>
  <form id="f">
    <input id="name" name="name" required autofocus
           placeholder="Your name" maxlength="40">
    <div class="go"><button type="submit">That's me</button></div>
  </form>
</div>
<script>
 var token = {{ token|tojson }};
 var next  = {{ next|tojson }};
 document.getElementById('f').addEventListener('submit', function (e) {
   e.preventDefault();
   var name = document.getElementById('name').value.trim();
   if (!name) { return; }
   // A redirect rather than fetch: the answer is a navigation, and the
   // server sends them on to where they were originally going.
   location.href = '/access/name?token=' + encodeURIComponent(token) +
                   '&name=' + encodeURIComponent(name) +
                   '&next=' + encodeURIComponent(next);
 });
</script>
</body></html>
