<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Say something &mdash; {{ panel }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
{{ chrome|safe }}
 :root{color-scheme:dark}
 h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
 .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
 label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;
       letter-spacing:.08em;color:var(--muted);margin:0 0 9px}
 .who{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
 .who button{min-height:46px;padding:0 17px;border-radius:11px;
   border:1px solid var(--line);background:var(--card);color:var(--text);
   font-size:14px;font-weight:500;font-family:inherit;cursor:pointer}
 .who button.on{border-color:var(--accent);color:var(--accent);
   background:linear-gradient(150deg,rgba(47,240,142,.12),var(--card) 70%)}
 textarea{min-height:120px;resize:vertical;line-height:1.5}
 .go{display:flex;gap:10px;margin:20px 0 0}
 .go button{min-height:54px;padding:0 24px;border-radius:12px;font-size:16px;
   font-weight:600;font-family:inherit;cursor:pointer;border:none;
   background:linear-gradient(135deg,var(--accent),var(--accent2));
   color:#0d1a12}
 .go button:active{transform:scale(.99)}
 #said{display:none;margin:20px 0 0;padding:14px 16px;border-radius:12px;
   border:1px solid var(--accent);background:var(--card2);font-size:14px;
   line-height:1.6}
 #said.bad{border-color:var(--bad);color:#ffb3b3}
 .hint{color:var(--muted);font-size:12.5px;line-height:1.6;margin:22px 0 0}
</style>
</head>
<body>
<p>{{ back|safe }}</p>

<h1>Say something</h1>
<p class="sub">The panel reads it out. If it cannot speak, it shows it instead.</p>

<label>From</label>
<div class="who" id="who">
  {% for name in users %}
  <button type="button" data-name="{{ name }}">{{ name }}</button>
  {% endfor %}
</div>

{% if voices %}
<label for="voice">Voice <span style="text-transform:none;font-weight:400;
  letter-spacing:0">&mdash; for this message only</span></label>
<select id="voice" style="margin:0 0 24px">
  <option value="">{{ voice or 'Default' }}</option>
  {% for v in voices %}{% if v != voice %}
  <option value="{{ v }}">{{ v }}</option>{% endif %}{% endfor %}
</select>
{% endif %}

<label for="message">Message</label>
<textarea id="message" placeholder="Dinner is ready" maxlength="400"
          autocomplete="off"></textarea>

<div class="go"><button type="button" id="send">Say it</button></div>
<div id="said"></div>

<p class="hint">Spoken as &ldquo;<span id="preview">Somebody</span> said
  &hellip;&rdquo;, so whoever is at the panel knows who it came from.</p>

<script>
var TOKEN = {{ token|tojson }};
var chosen = '';

var who = document.getElementById('who');
Array.prototype.forEach.call(who.querySelectorAll('button'), function (b) {
  b.addEventListener('click', function () {
    Array.prototype.forEach.call(who.querySelectorAll('button'), function (o) {
      o.classList.remove('on');
    });
    b.classList.add('on');
    chosen = b.getAttribute('data-name');
    document.getElementById('preview').textContent = chosen;
  });
});
// The device you are on, picked already: it is right most of the time and
// wrong only in a way one tap fixes.
var mine = who.querySelector('button[data-name="{{ device }}"]');
if (mine) { mine.click(); }

function show(text, bad) {
  var box = document.getElementById('said');
  box.className = bad ? 'bad' : '';
  box.style.display = 'block';
  box.textContent = text;
}

document.getElementById('send').addEventListener('click', function () {
  var message = document.getElementById('message').value.trim();
  if (!message) { show('Type something first.', true); return; }

  var picker = document.getElementById('voice');
  var voice = picker ? picker.value : '';
  fetch('/say?token=' + TOKEN + '&from=' + encodeURIComponent(chosen) +
        '&voice=' + encodeURIComponent(voice) +
        '&message=' + encodeURIComponent(message),
        {headers: {'Accept': 'application/json'}})
    .then(function (r) { return r.json().then(function (d) {
      show(d.what || d.reason || 'Sent.', !r.ok);
      if (r.ok) { document.getElementById('message').value = ''; }
    }); })
    .catch(function () { show('The panel did not answer.', true); });
});
</script>
</body>
</html>
