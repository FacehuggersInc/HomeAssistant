<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ key }} &mdash; {{ panel }}</title>
<style>
{{ chrome|safe }}
 h1{font-size:22px;margin:10px 0 2px}
 p.sub{font-size:12px;font-family:ui-monospace,monospace;word-break:break-all}
 .drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;
      text-align:center;color:var(--muted)}
 .drop.over{border-color:var(--accent);color:var(--text)}
 .drop .big{font-size:30px;display:block;margin-bottom:6px}
 /* The label IS the button; the input behind it is hidden. */
 label.browse{display:block;margin-top:14px;min-height:50px;line-height:50px;
      border-radius:11px;border:none;text-align:center;font-size:15px;
      font-weight:600;cursor:pointer;color:#0d1a12;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 6px 22px var(--glow)}
 button{width:100%;margin-top:12px}
 button:disabled{opacity:.45}
 ul{list-style:none;padding:0;margin:14px 0 0}
 li{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
 li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 li .sz{color:var(--muted);font-size:12px;white-space:nowrap}
 li .x{color:var(--bad);padding:0 8px;font-size:20px;line-height:1}
 .ok{color:var(--accent)} .bad{color:var(--bad)}
 /* The listing. A grid rather than rows: most of what goes in these folders
    is pictures, and a filename is a poor answer to "which one is that". */
 h2{font-size:15px;margin:26px 0 8px;color:var(--muted);font-weight:600}
 .grid{display:grid;gap:10px;
       grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
 .finder{display:flex;gap:8px;margin:10px 0 6px}
 .finder input[type=search]{flex:1 1 auto;min-width:0}
 .finder select{flex:0 0 34%}
 .more{width:100%;margin-top:10px}
 .cell{position:relative;border:1px solid var(--line);border-radius:10px;
       overflow:hidden;cursor:pointer;background:rgba(255,255,255,.03)}
 .cell .thumb{width:100%;height:78px;object-fit:cover;display:block}
 .cell .glyph{height:78px;display:flex;align-items:center;
              justify-content:center;font-size:26px;color:var(--muted)}
 .cell .meta{padding:6px 7px;font-size:11px;line-height:1.3}
 .cell .meta .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .cell .meta .sz{color:var(--muted);font-size:10px}
 /* Marked, not gone. Nothing is removed until the button at the bottom. */
 .cell.marked{border-color:var(--bad);opacity:.55}
 .cell.marked:after{content:"\2715";position:absolute;top:6px;right:8px;
       color:var(--bad);font-size:16px;font-weight:700}
 #wipe{background:var(--bad);color:#fff;border:none}
 #wipe[hidden]{display:none}
</style></head><body>
<div class="backrow">{{ back_button(token)|safe }}{{ back_button(token, "All folders", "/upload")|safe }}</div>
<h1>Upload to {{ key }}</h1>
<p class="sub">{{ path }}</p>

<section>
  <div class="drop" id="drop">
    <span class="big">&#8679;</span>
    Drop files here
  </div>
  <label class="browse" for="pick">Choose files</label>
  <input type="file" id="pick" multiple hidden>

  <ul id="list"><li class="empty">Nothing queued yet.</li></ul>
  <button id="send" disabled>Upload</button>
</section>

<section id="resultBox" style="display:none">
  <ul id="results"></ul>
</section>

{% if deletable %}
<section id="listing">
  <h2>Already here</h2>
  <div class="finder">
    <input type="search" id="find" placeholder="Search this folder"
           autocomplete="off">
    <select id="order">
      <option value="newest">Newest</option>
      <option value="name">Name</option>
      <option value="oldest">Oldest</option>
      <option value="largest">Largest</option>
    </select>
  </div>
  <p class="sub" id="found"></p>
  <div class="grid" id="files"></div>
  <button id="wipe" hidden></button>
</section>
{% endif %}

<script src="/web?name=listing.js"></script>
<script>
 var KEY = {{ key|tojson }};
 /* Everything in the folder, and how much of it is drawn. The filter runs
    over all of them; the cap only decides how many tiles exist, because a
    folder of four hundred images is a page a phone will not scroll. */
 var ALL = [];
 /* Sixty at a time, appended as the bottom comes into view. A batch is only
    ever sixty nodes, so growing costs the same whether it is the first or
    the twelfth - where redrawing the whole grid gets slower the further
    down somebody is. */
 var BATCH = 60;
 var drawn = 0;
 var stopWatching = null;
 var TOKEN = {{ token|tojson }};
 var queue = [];

 var drop = document.getElementById('drop');
 var list = document.getElementById('list');
 var send = document.getElementById('send');
 var results = document.getElementById('results');
 var resultBox = document.getElementById('resultBox');

 function human(n) {
   if (n < 1024) return n + ' B';
   if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
   return (n / 1048576).toFixed(1) + ' MB';
 }

 function draw() {
   list.innerHTML = '';
   if (!queue.length) {
     list.innerHTML = '<li class="empty">Nothing queued yet.</li>';
     send.disabled = true;
     send.textContent = 'Upload';
     return;
   }
   queue.forEach(function (f, i) {
     var li = document.createElement('li');
     var nm = document.createElement('span');
     nm.className = 'nm'; nm.textContent = f.name;
     var sz = document.createElement('span');
     sz.className = 'sz'; sz.textContent = human(f.size);
     var x = document.createElement('span');
     x.className = 'x'; x.textContent = '\u00d7';
     x.addEventListener('click', function () { queue.splice(i, 1); draw(); });
     li.appendChild(nm); li.appendChild(sz); li.appendChild(x);
     list.appendChild(li);
   });
   send.disabled = false;
   send.textContent = 'Upload ' + queue.length +
                      ' file' + (queue.length === 1 ? '' : 's');
 }

 function add(files) {
   for (var i = 0; i < files.length; i++) { queue.push(files[i]); }
   draw();
 }

 document.getElementById('pick').addEventListener('change', function () {
   add(this.files); this.value = '';
 });

 ['dragenter', 'dragover'].forEach(function (e) {
   drop.addEventListener(e, function (ev) {
     ev.preventDefault(); drop.classList.add('over');
   });
 });
 ['dragleave', 'drop'].forEach(function (e) {
   drop.addEventListener(e, function (ev) {
     ev.preventDefault(); drop.classList.remove('over');
   });
 });
 drop.addEventListener('drop', function (ev) {
   if (ev.dataTransfer && ev.dataTransfer.files) { add(ev.dataTransfer.files); }
 });

 function report(name, ok, detail) {
   resultBox.style.display = 'block';
   var li = document.createElement('li');
   var nm = document.createElement('span');
   nm.className = 'nm'; nm.textContent = name;
   var st = document.createElement('span');
   st.className = ok ? 'ok' : 'bad';
   st.textContent = ok ? 'uploaded' : (detail || 'failed');
   li.appendChild(nm); li.appendChild(st);
   results.appendChild(li);
 }

 send.addEventListener('click', function () {
   if (!queue.length) { return; }
   send.disabled = true;
   var pending = queue.slice();
   queue = [];
   draw();
   var left = pending.length;
   pending.forEach(function (file) {
     var body = new FormData();
     body.append('file', file);
     fetch('/upload/' + encodeURIComponent(KEY) +
           '?token=' + encodeURIComponent(TOKEN),
           { method: 'POST', body: body })
       .then(function (r) { return r.json().catch(function () { return {}; }); })
       .then(function (b) {
         report(file.name, b.request === 'Success', b.reason);
       })
       .catch(function (e) { report(file.name, false, String(e)); })
       .finally(function () { if (--left === 0) { send.disabled = false; } });
   });
 });
</script>

{% if deletable %}
<script>
 (function () {
   var grid = document.getElementById('files');
   var wipe = document.getElementById('wipe');
   var marked = {};

   function url(suffix) {
     return '/upload/' + encodeURIComponent(KEY) + suffix +
            '?token=' + encodeURIComponent(TOKEN);
   }

   function refreshButton() {
     var names = Object.keys(marked);
     wipe.hidden = names.length === 0;
     wipe.textContent = names.length === 1
       ? 'Delete 1 file'
       : 'Delete ' + names.length + ' files';
   }

   function cell(file) {
     var box = document.createElement('div');
     box.className = 'cell';
     if (file.is_image) {
       var img = document.createElement('img');
       img.className = 'thumb';
       img.loading = 'lazy';
       img.src = url('/file/' + encodeURIComponent(file.name));
       box.appendChild(img);
     } else {
       var glyph = document.createElement('div');
       glyph.className = 'glyph';
       glyph.textContent = '\u25A4';
       box.appendChild(glyph);
     }
     var meta = document.createElement('div');
     meta.className = 'meta';
     var nm = document.createElement('div');
     nm.className = 'nm'; nm.textContent = file.name; nm.title = file.name;
     var sz = document.createElement('div');
     sz.className = 'sz'; sz.textContent = file.size;
     meta.appendChild(nm); meta.appendChild(sz);
     box.appendChild(meta);

     box.addEventListener('click', function () {
       if (marked[file.name]) { delete marked[file.name]; }
       else { marked[file.name] = true; }
       box.classList.toggle('marked');
       refreshButton();
     });
     return box;
   }

   /* From the top: a different filter or order is a different list. */
   function draw() {
     drawn = 0;
     if (stopWatching) { stopWatching(); stopWatching = null; }
     grid.textContent = '';
     grow();
   }

   /* The next batch, appended. Nothing already on screen is touched. */
   function grow() {
     var found = document.getElementById('found');

     if (!ALL.length) {
       grid.innerHTML = '<p class="sub">Nothing here yet.</p>';
       if (found) { found.textContent = ''; }
       return;
     }

     var box = document.getElementById('find');
     var pick = document.getElementById('order');
     var result = Listing.view(ALL, {
       query: box ? box.value : '',
       sort: pick ? pick.value : 'newest',
       fields: ['name'],
       from: drawn,
       window: BATCH
     });
     drawn += result.shown.length;

     if (found) { found.textContent = Listing.summary(result, 'file'); }

     var marker = document.getElementById('more');
     if (marker) { marker.remove(); }
     result.shown.forEach(function (f) { grid.appendChild(cell(f)); });

     /* A marker after the last tile. Scrolling towards it draws the next
        batch; pressing it does the same, for a browser with no observer. */
     if (result.hidden) {
       var more = document.createElement('button');
       more.type = 'button';
       more.id = 'more';
       more.className = 'more';
       more.textContent = 'Show the other ' + result.hidden;
       more.addEventListener('click', grow);
       grid.appendChild(more);
       if (stopWatching) { stopWatching(); }
       stopWatching = Listing.whenNear(more, grow);
     } else if (stopWatching) {
       stopWatching();
       stopWatching = null;
     }
   }

   function load() {
     marked = {};
     refreshButton();
     grid.textContent = '';
     fetch(url('/files'))
       .then(function (r) { return r.json(); })
       .then(function (body) {
         ALL = (body && body.files) || [];
         draw();
       })
       .catch(function () {
         grid.innerHTML = '<p class="bad">Could not list this folder.</p>';
       });
   }

   (function () {
     var box = document.getElementById('find');
     var pick = document.getElementById('order');
     /* Typing narrows from the top again: the cap is about how much is on
        screen, and a search that starts sixty in is a search that misses. */
     if (box) {
       box.addEventListener('input', draw);
     }
     if (pick) { pick.addEventListener('change', draw); }
   })();

   wipe.addEventListener('click', function () {
     var names = Object.keys(marked);
     if (!names.length) { return; }
     // Asked once, and by count rather than by name: the marks are on the
     // screen behind this, so the number is what wants confirming.
     var question = names.length === 1
       ? 'Delete "' + names[0] + '"? This cannot be undone.'
       : 'Delete these ' + names.length + ' files? This cannot be undone.';
     if (!window.confirm(question)) { return; }
     wipe.disabled = true;
     fetch(url('/delete'), {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({ files: names })
     })
       .then(function (r) { return r.json(); })
       .then(function (body) {
         var failed = Object.keys((body && body.failed) || {});
         if (failed.length) {
           window.alert('Could not delete: ' + failed.join(', '));
         }
       })
       .catch(function (e) { window.alert('Delete failed: ' + e); })
       .finally(function () { wipe.disabled = false; load(); });
   });

   load();
   // Whatever was just uploaded belongs in the listing too.
   document.getElementById('send').addEventListener('click', function () {
     setTimeout(load, 1200);
   });
 })();
</script>
{% endif %}
</body></html>
