<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel }}</title>
<style>
{{ chrome|safe }}
 body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;max-width:none}
 .card{padding:32px;max-width:460px;width:100%;text-align:center;
       border-radius:16px}
 h1{font-size:22px;margin:0 0 8px}
 p{color:var(--muted);margin:0 0 20px}
 .dots{font-size:26px;letter-spacing:4px;color:var(--accent);height:32px}
 .bad{color:var(--bad)}
</style></head>
<body>
<div class="card">
  <h1 id="head">Waiting for approval</h1>
  <p id="body">A dialog is open on the panel. Allow this device there and this
     page will carry on by itself.</p>
  <div class="dots" id="dots">&middot;</div>
</div>
<script>
 var token = {{ token|tojson }};
 var next  = {{ next|tojson }};

 // Kept, so a return visit does not queue a second approval request for a
 // device that has already been allowed once.
 try { localStorage.setItem('ha-token', token); } catch (e) {}

 var dots = document.getElementById('dots');
 var ticks = 0;

 // Any token already in the target is dropped before the real one is added.
 // Appending gives "?token=OLD&token=NEW", and the FIRST value wins in every
 // parser - so the browser went back holding the token that was just refused
 // and bounced straight back here.
 function stripToken(url) {
   var parts = String(url || '/').split('?');
   var path = parts[0] || '/';
   var query = parts.slice(1).join('?');
   if (!query) { return path; }
   var kept = query.split('&').filter(function (pair) {
     var key = pair.split('=')[0];
     return pair && key !== 'token' && key !== 'id';
   });
   return kept.length ? path + '?' + kept.join('&') : path;
 }

 function go() {
   var target = stripToken(next);
   var join = target.indexOf('?') === -1 ? '?' : '&';
   location.replace(target + join + 'token=' + encodeURIComponent(token));
 }

 function poll() {
   fetch('/access/state?token=' + encodeURIComponent(token))
     .then(function (r) { return r.json(); })
     .then(function (body) {
       // Let in, but the panel is still being asked who names this device.
       // Keep waiting: walking off to the naming page now means two people
       // naming it at once.
       if (body.state === 'deciding') {
         var head = document.getElementById('head');
         var body_el = document.getElementById('body');
         if (head) { head.textContent = 'Allowed'; }
         if (body_el) {
           body_el.textContent = 'Waiting while the panel decides who names ' +
                                 'this device.';
         }
         setTimeout(poll, 1500);
         return;
       }

       if (body.state === 'approved') {
         // Named first, if the panel handed that decision over.
         if (body.needs_name) {
           location.replace('/access/name?token=' + encodeURIComponent(token) +
                            '&next=' + encodeURIComponent(next));
           return;
         }
         go(); return;
       }
       if (body.state === 'denied') {
         document.getElementById('head').textContent = 'Not allowed';
         document.getElementById('head').className = 'bad';
         document.getElementById('body').textContent =
           'The panel denied this device. Ask again by reloading this page.';
         dots.textContent = '';
         return;
       }
       if (body.state === 'unknown') {
         // The request timed out on the panel. Asking again is better than
         // sitting here forever on a token nobody remembers.
         location.replace('/access/wait?next=' + encodeURIComponent(next));
         return;
       }
       ticks = (ticks + 1) % 4;
       dots.textContent = '\u00b7'.repeat(ticks + 1);
       setTimeout(poll, 1500);
     })
     .catch(function () { setTimeout(poll, 3000); });
 }
 poll();
</script>
</body></html>
