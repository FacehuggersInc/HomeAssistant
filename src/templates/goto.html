<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go to &mdash; {{ panel }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
{{ chrome|safe }}
 h1{font-size:22px;margin:0 0 4px}
 .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:16px;margin:0 0 16px}
 .label{color:var(--muted);font-size:13px;margin:0 0 8px}
 .pages{display:flex;flex-direction:column;gap:8px}
 .page{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
       padding:0 16px;border:1px solid var(--line);border-radius:10px;
       background:#141417;color:var(--text);font-size:16px;font-weight:600;
       text-align:left;cursor:pointer}
 .page:active{opacity:.75}
 .page.here{border-color:var(--accent)}
 .page .tag{margin-left:auto;font-size:11px;font-weight:700;
            text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
 input{width:100%;box-sizing:border-box;min-height:48px;background:#141417;
       color:var(--text);border:1px solid var(--line);border-radius:8px;
       padding:0 12px;font-size:16px;font-family:inherit}
 .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}
 button.go{flex:1 1 130px;min-height:48px;font-size:16px;font-weight:600;
           border-radius:9px;border:1px solid var(--accent);
           background:var(--accent);color:#0f2418;cursor:pointer}
 .hint{color:var(--muted);font-size:12px;margin:8px 0 0;line-height:1.5}
 #note{display:none;margin:0 0 16px;padding:10px 14px;border-radius:9px;
       background:rgba(47,240,142,.12);border:1px solid rgba(47,240,142,.4);
       font-size:14px;word-break:break-word}
 #note.bad{background:rgba(224,138,138,.12);border-color:rgba(224,138,138,.45)}
</style>
</head>
<body>
<p><a class="back" href="/?token={{ token }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  Back</a></p>

<h1>Go to</h1>
<p class="sub">Change what {{ panel }} is showing.</p>

<div id="note"></div>

<div class="card">
  <p class="label">Pages</p>
  <div class="pages" id="pages"><p class="hint">Loading&hellip;</p></div>
</div>

<div class="card">
  <p class="label">Open a web page</p>
  <input id="url" type="url" inputmode="url" spellcheck="false"
         placeholder="https://example.com">
  <div class="row"><button class="go" id="openurl">Open on the panel</button></div>
  <p class="hint">Sends the address to the panel's browser page. The panel
    stays there until something else changes it.</p>
</div>

<script>
var TOKEN = {{ token|tojson }};
var note = document.getElementById('note');

function say(message, bad) {
  note.textContent = message;
  note.className = bad ? 'bad' : '';
  note.style.display = 'block';
}

function label(key) {
  // "#cwb_home_page" reads as nothing. Strip the marker and the underscores.
  var text = key.replace(/^#/, '').replace(/[_-]+/g, ' ');
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function go(key, extra) {
  // The '#' has to be percent-encoded or the server never sees what follows
  // it - a fragment is not sent. encodeURIComponent handles that.
  var url = '/goto/' + encodeURIComponent(key) +
            '?token=' + encodeURIComponent(TOKEN) + (extra || '');
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.request === 'Success') {
        say('The panel is now on ' + label(d.page) + '.');
        load();
      } else {
        say(d.reason || 'Could not change the page.', true);
      }
    })
    .catch(function (e) { say('Could not reach the panel: ' + e, true); });
}

function load() {
  fetch('/pages?token=' + encodeURIComponent(TOKEN))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var host = document.getElementById('pages');
      host.innerHTML = '';
      if (d.request !== 'Success') {
        say(d.reason || 'Could not list the pages.', true);
        return;
      }
      d.pages.forEach(function (key) {
        var btn = document.createElement('button');
        btn.className = 'page' + (key === d.current ? ' here' : '');
        btn.textContent = label(key);
        if (key === d.current) {
          var tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = 'on screen';
          btn.appendChild(tag);
        }
        btn.addEventListener('click', function () { go(key); });
        host.appendChild(btn);
      });
    })
    .catch(function (e) { say('Could not reach the panel: ' + e, true); });
}

document.getElementById('openurl').addEventListener('click', function () {
  var value = document.getElementById('url').value.trim();
  if (!value) { say('Type an address first.', true); return; }
  if (!/^https?:\/\//i.test(value)) { value = 'https://' + value; }
  go('#webpage', '&url=' + encodeURIComponent(value));
});

load();
</script>
</body>
</html>
